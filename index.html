<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RS TOP-UP | Free Fire</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#080d1c;
  color:#fff;
  min-height:100vh;
}

.container{
  width:100%;
  max-width:520px;
  margin:auto;
  padding:20px 15px 35px;
}

.header{
  text-align:center;
  padding:25px 10px;
}

.logo{
  font-size:42px;
  margin-bottom:8px;
}

.header h1{
  font-size:30px;
  margin-bottom:7px;
}

.header p{
  color:#9ca6bd;
  font-size:14px;
}

/* CATEGORY */

.categories{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:16px;
}

.category{
  border:1px solid #344362;
  background:#121a2d;
  color:white;
  padding:15px 8px;
  border-radius:13px;
  cursor:pointer;
  text-align:center;
  font-size:14px;
  font-weight:bold;
}

.category.active{
  border-color:#22c55e;
  background:#183b2b;
}

.category-icon{
  display:block;
  font-size:25px;
  margin-bottom:7px;
}

/* CARD */

.card{
  background:#121a2d;
  border:1px solid #263452;
  border-radius:18px;
  padding:20px;
  margin-bottom:16px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.card-title{
  font-size:20px;
  font-weight:bold;
  margin-bottom:18px;
}

label{
  display:block;
  font-size:14px;
  font-weight:bold;
  margin-bottom:8px;
  color:#dce3f2;
}

input{
  width:100%;
  padding:14px;
  border-radius:10px;
  border:1px solid #344362;
  background:#0b1122;
  color:white;
  font-size:16px;
  outline:none;
  margin-bottom:18px;
}

input:focus{
  border-color:#3b82f6;
}

/* PACKAGES */

.packages{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.package{
  border:1px solid #344362;
  background:#19233b;
  color:white;
  padding:15px 8px;
  border-radius:12px;
  cursor:pointer;
  text-align:center;
}

.package:hover{
  background:#22304e;
}

.package.active{
  border-color:#22c55e;
  background:#183b2b;
}

.package-name{
  font-size:16px;
  font-weight:bold;
  margin-bottom:6px;
}

.package-info{
  color:#b8c2d6;
  font-size:13px;
  margin-bottom:6px;
}

.price{
  color:#9ee6b5;
  font-size:15px;
  font-weight:bold;
}

/* SUMMARY */

.summary{
  background:#0b1122;
  border-radius:12px;
  padding:15px;
  margin-top:18px;
}

.summary-row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:8px 0;
  color:#b8c2d6;
  border-bottom:1px solid #202c45;
}

.summary-row:last-child{
  border-bottom:none;
}

.summary-row strong{
  color:white;
  text-align:right;
  max-width:60%;
  overflow-wrap:anywhere;
}

.total{
  font-size:18px;
}

/* BUTTON */

.btn{
  width:100%;
  border:none;
  border-radius:11px;
  padding:15px;
  margin-top:18px;
  background:#22c55e;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

.btn:hover{
  background:#16a34a;
}

.security{
  text-align:center;
  color:#9ca6bd;
  font-size:13px;
  line-height:1.6;
  margin-top:15px;
}

.notice{
  background:#172033;
  border:1px solid #293750;
  border-radius:12px;
  padding:14px;
  margin-top:16px;
  color:#aeb9ce;
  font-size:13px;
  line-height:1.6;
}

footer{
  text-align:center;
  color:#68738a;
  font-size:12px;
  padding-top:15px;
}

@media(max-width:380px){
  .packages{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="container">

<header class="header">
  <div class="logo">💎</div>
  <h1>RS TOP-UP</h1>
  <p>Free Fire Top-Up Center</p>
</header>


<!-- CATEGORIES -->

<div class="categories">

  <button class="category active"
    onclick="changeCategory('diamond',this)">
    <span class="category-icon">💎</span>
    Diamond
  </button>

  <button class="category"
    onclick="changeCategory('weekly',this)">
    <span class="category-icon">📅</span>
    Weekly
  </button>

  <button class="category"
    onclick="changeCategory('weeklylite',this)">
    <span class="category-icon">⚡</span>
    Weekly Lite
  </button>

  <button class="category"
    onclick="changeCategory('monthly',this)">
    <span class="category-icon">🗓️</span>
    Monthly
  </button>

  <button class="category"
    onclick="changeCategory('levelup',this)">
    <span class="category-icon">🎟️</span>
    Level Up Pass
  </button>

</div>


<div class="card">

  <div class="card-title" id="categoryTitle">
    💎 Diamond Top-Up
  </div>

  <label for="uid">Free Fire UID</label>

  <input
    type="text"
    id="uid"
    placeholder="Enter your Free Fire UID"
    inputmode="numeric"
    autocomplete="off"
    maxlength="20"
  >

  <label>Select Package</label>

  <div class="packages" id="packages"></div>


  <div class="summary">

    <div class="summary-row">
      <span>UID</span>
      <strong id="summaryUID">Not entered</strong>
    </div>

    <div class="summary-row">
      <span>Package</span>
      <strong id="summaryPackage">Not selected</strong>
    </div>

    <div class="summary-row total">
      <span>Total</span>
      <strong id="summaryPrice">৳0</strong>
    </div>

  </div>


  <button class="btn" onclick="continueOrder()">
    CONTINUE ORDER
  </button>


  <div class="security">
    🔒 কোনো Free Fire password বা OTP প্রয়োজন নেই।
  </div>


  <div class="notice">
    ⚠️ বর্তমানে এটি website/order interface।
    Payment এবং real diamond/membership delivery এখনো সংযুক্ত করা হয়নি।
  </div>

</div>


<footer>
  © 2026 RS TOP-UP
</footer>

</div>


<script>

let currentCategory = "diamond";
let selectedPackage = "";
let selectedPrice = 0;


/* PACKAGE DATA */

const packageData = {

  diamond: [
    ["💎 100 Diamonds","100 Diamonds",80],
    ["💎 310 Diamonds","310 Diamonds",220],
    ["💎 520 Diamonds","520 Diamonds",350],
    ["💎 1060 Diamonds","1060 Diamonds",700]
  ],

  weekly: [
    ["📅 Weekly","Weekly Membership",150],
    ["📅 Weekly Plus","Weekly Membership",250]
  ],

  weeklylite: [
    ["⚡ Weekly Lite","Weekly Lite",80],
    ["⚡ Weekly Lite Plus","Weekly Lite",120]
  ],

  monthly: [
    ["🗓️ Monthly","Monthly Membership",450],
    ["🗓️ Monthly Plus","Monthly Membership",650]
  ],

  levelup: [
    ["🎟️ Level Up Pass","Level Up Pass",250],
    ["🎟️ Level Up Pass Plus","Level Up Pass",400]
  ]

};


/* CATEGORY CHANGE */

function changeCategory(category,button){

  currentCategory = category;

  selectedPackage = "";
  selectedPrice = 0;

  document.querySelectorAll(".category").forEach(function(item){
    item.classList.remove("active");
  });

  button.classList.add("active");

  const titles = {

    diamond:"💎 Diamond Top-Up",
    weekly:"📅 Weekly Membership",
    weeklylite:"⚡ Weekly Lite",
    monthly:"🗓️ Monthly Membership",
    levelup:"🎟️ Level Up Pass"

  };

  document.getElementById("categoryTitle").textContent =
    titles[category];

  document.getElementById("summaryPackage").textContent =
    "Not selected";

  document.getElementById("summaryPrice").textContent =
    "৳0";

  showPackages(category);
}


/* SHOW PACKAGES */

function showPackages(category){

  const container = document.getElementById("packages");

  container.innerHTML = "";

  packageData[category].forEach(function(item){

    const button = document.createElement("button");

    button.className = "package";

    button.innerHTML =
      '<div class="package-name">' + item[0] + '</div>' +
      '<div class="package-info">' + item[1] + '</div>' +
      '<div class="price">৳' + item[2] + '</div>';

    button.onclick = function(){

      document.querySelectorAll(".package").forEach(function(p){
        p.classList.remove("active");
      });

      button.classList.add("active");

      selectedPackage = item[1];
      selectedPrice = item[2];

      document.getElementById("summaryPackage").textContent =
        selectedPackage;

      document.getElementById("summaryPrice").textContent =
        "৳" + selectedPrice;
    };

    container.appendChild(button);

  });

}


/* UID */

document.getElementById("uid").addEventListener("input",function(){

  this.value = this.value.replace(/[^0-9]/g,"");

  const uid = this.value.trim();

  document.getElementById("summaryUID").textContent =
    uid === "" ? "Not entered" : uid;

});


/* ORDER */

function continueOrder(){

  const uid =
    document.getElementById("uid").value.trim();

  if(uid === ""){
    alert("Please enter your Free Fire UID.");
    return;
  }

  if(selectedPackage === ""){
    alert("Please select a package.");
    return;
  }

  const orderId =
    "RS" + Date.now().toString().slice(-8);

  alert(
    "Order Preview\n\n" +
    "Order ID: " + orderId + "\n" +
    "UID: " + uid + "\n" +
    "Package: " + selectedPackage + "\n" +
    "Price: ৳" + selectedPrice + "\n\n" +
    "Payment and real delivery are not connected yet."
  );

}


/* FIRST LOAD */

showPackages("diamond");

</script>

</body>
</html>
