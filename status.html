<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Check Order Status - RS TOP-UP</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f3ff;
      color: #222;
      min-height: 100vh;
    }

    .header {
      background: #6d28d9;
      color: white;
      padding: 22px 18px;
      text-align: center;
    }

    .header h1 {
      font-size: 24px;
      margin-bottom: 6px;
    }

    .header p {
      font-size: 13px;
      opacity: 0.9;
    }

    .container {
      width: 92%;
      max-width: 520px;
      margin: 25px auto;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .card h2 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .description {
      color: #666;
      font-size: 14px;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #6d28d9;
    }

    button {
      width: 100%;
      margin-top: 14px;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #6d28d9;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 13px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.5;
    }

    .error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .loading {
      display: block;
      background: #ede9fe;
      color: #5b21b6;
    }

    .result {
      display: none;
      margin-top: 20px;
    }

    .status-box {
      text-align: center;
      padding: 18px;
      border-radius: 14px;
      margin-bottom: 18px;
    }

    .status-box.pending {
      background: #fef3c7;
      color: #92400e;
    }

    .status-box.paid {
      background: #dcfce7;
      color: #166534;
    }

    .status-box.rejected {
      background: #fee2e2;
      color: #991b1b;
    }

    .status-icon {
      font-size: 30px;
      margin-bottom: 7px;
    }

    .status-title {
      font-size: 20px;
      font-weight: bold;
    }

    .info {
      border-top: 1px solid #eee;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 13px 0;
      border-bottom: 1px solid #eee;
      font-size: 14px;
    }

    .row .label {
      color: #777;
    }

    .row .value {
      font-weight: bold;
      text-align: right;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #6d28d9;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
    }

    .footer {
      text-align: center;
      color: #888;
      font-size: 12px;
      padding: 25px 10px;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>RS TOP-UP</h1>
    <p>Order Status</p>
  </div>

  <div class="container">

    <div class="card">

      <h2>Check Your Order</h2>

      <p class="description">
        Enter your Order ID below to check your payment and order status.
      </p>

      <label for="orderId">Order ID</label>

      <input
        type="text"
        id="orderId"
        placeholder="Example: RS12345678"
        autocomplete="off"
        maxlength="30"
      >

      <button id="checkBtn" onclick="checkStatus()">
        Check Status
      </button>

      <div id="message" class="message"></div>

      <div id="result" class="result">

        <div id="statusBox" class="status-box">

          <div id="statusIcon" class="status-icon"></div>

          <div id="statusTitle" class="status-title"></div>

        </div>

        <div class="info">

          <div class="row">
            <span class="label">Order ID</span>
            <span class="value" id="showOrderId"></span>
          </div>

          <div class="row">
            <span class="label">Package</span>
            <span class="value" id="showPackage"></span>
          </div>

          <div class="row">
            <span class="label">Amount</span>
            <span class="value" id="showPrice"></span>
          </div>

          <div class="row">
            <span class="label">Payment</span>
            <span class="value" id="showPayment"></span>
          </div>

          <div class="row">
            <span class="label">Created</span>
            <span class="value" id="showDate"></span>
          </div>

        </div>

      </div>

      <a href="/" class="back">
        ← Back to RS TOP-UP
      </a>

    </div>

  </div>

  <div class="footer">
    © RS TOP-UP
  </div>


  <script>

    const orderIdInput = document.getElementById("orderId");
    const checkBtn = document.getElementById("checkBtn");
    const message = document.getElementById("message");
    const result = document.getElementById("result");


    // ==========================================
    // ESCAPE HTML
    // ==========================================

    function escapeHTML(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    // ==========================================
    // CLEAR MESSAGE
    // ==========================================

    function clearMessage() {
      message.className = "message";
      message.textContent = "";
      message.style.display = "none";
    }


    // ==========================================
    // SHOW MESSAGE
    // ==========================================

    function showMessage(text, type) {
      message.className = "message " + type;
      message.textContent = text;
      message.style.display = "block";
    }


    // ==========================================
    // CHECK ORDER STATUS
    // ==========================================

    async function checkStatus() {

      clearMessage();
      result.style.display = "none";

      const orderId = orderIdInput.value.trim();

      if (!orderId) {
        showMessage(
          "Please enter your Order ID.",
          "error"
        );
        return;
      }

      checkBtn.disabled = true;
      checkBtn.textContent = "Checking...";

      showMessage(
        "Checking your order...",
        "loading"
      );

      try {

        const response = await fetch(
          "/api/order/status?order_id=" +
          encodeURIComponent(orderId)
        );

        const data = await response.json();

        if (!response.ok || !data.success) {

          showMessage(
            data.message || "Order not found.",
            "error"
          );

          return;
        }

        const order = data.order;

        showOrder(
          order
        );

        clearMessage();

      } catch (error) {

        showMessage(
          "Could not connect to the server. Please try again.",
          "error"
        );

      } finally {

        checkBtn.disabled = false;
        checkBtn.textContent = "Check Status";

      }
    }


    // ==========================================
    // DISPLAY ORDER
    // ==========================================

    function showOrder(order) {

      const status =
        String(order.status || "").toLowerCase();

      const statusBox =
        document.getElementById("statusBox");

      const statusIcon =
        document.getElementById("statusIcon");

      const statusTitle =
        document.getElementById("statusTitle");


      statusBox.className = "status-box";


      if (status === "paid") {

        statusBox.classList.add("paid");

        statusIcon.textContent = "✓";
        statusTitle.textContent =
          "Payment Verified";

      } else if (status === "rejected") {

        statusBox.classList.add("rejected");

        statusIcon.textContent = "✕";
        statusTitle.textContent =
          "Payment Rejected";

      } else {

        statusBox.classList.add("pending");

        statusIcon.textContent = "⏳";
        statusTitle.textContent =
          "Payment Pending";

      }


      document.getElementById("showOrderId")
        .textContent = order.order_id || "-";

      document.getElementById("showPackage")
        .textContent = order.package_name || "-";

      document.getElementById("showPrice")
        .textContent = "৳" + (order.price ?? 0);

      document.getElementById("showPayment")
        .textContent = order.payment_method || "-";

      document.getElementById("showDate")
        .textContent = order.created_at || "-";


      result.style.display = "block";
    }


    // ==========================================
    // ENTER KEY
    // ==========================================

    orderIdInput.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {
          checkStatus();
        }

      }
    );

  </script>

</body>
  </html>
